name: Update Keyboxes
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-keyboxes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Fetch all keyboxes (TAKR + Yuri)
        run: npm run fetch-all
      - name: Build index
        run: npm run build-index
      - name: Commit changes
        run: |
          set -e
          git config user.name "keybox-hub-bot"
          git config user.email "keybox-hub-bot@users.noreply.github.com"
          git add -A public/keyboxes public/data
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: auto-update keyboxes [skip ci]"
          git push origin HEAD:main || true
