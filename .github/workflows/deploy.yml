name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # The updater commits with `[skip ci]`, which suppresses push-based runs.
  # workflow_run guarantees a deploy after every index refresh.
  workflow_run:
    workflows: ['Update Keyboxes']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Skip deploy if the triggering update workflow failed.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build static site
        env:
          NODE_VERSION: 20
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://keybox-hub.pages.dev' }}
        run: npm run build

      - name: Verify build output
        run: |
          test -d out || { echo "::error::out/ directory missing"; exit 1; }
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          echo "Build size: $(du -sh out | cut -f1)"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CF_PAGES_PROJECT || 'keybox-hub' }}
            --branch=${{ github.ref_name }}
            --commit-dirty=true
