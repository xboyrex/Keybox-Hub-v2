name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_VERSION: 20
        run: npm run build

      - name: Assert static export
        run: |
          test -d out || { echo "::error::output: 'export' did not produce out/"; exit 1; }
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html || echo "::warning::out/404.html missing"
          echo "✅ static export OK"
