<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Keybox Hub — Every keybox. Always fresh.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="100%" stop-color="#0A1826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96 96) scale(2.4)">
    <rect x="1" y="1" width="38" height="38" rx="10" fill="#05070A" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="15" cy="16" r="4.4" fill="none" stroke="url(#accent)" stroke-width="2.2"/>
    <path d="M18.2 19.2 L26.5 27.5" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M23.2 24.2 L25.4 22" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
    <path d="M25.8 26.8 L28 24.6" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="96" y="320" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="88" font-weight="700" fill="#FFFFFF" letter-spacing="-2">
    Keybox Hub
  </text>

  <text x="96" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="600" fill="url(#accent)">
    Every keybox. Always fresh.
  </text>

  <text x="96" y="462" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#94A3B8">
    Public keybox.xml files from GitHub — indexed, hashed, refreshed every 6 hours.
  </text>

  <g transform="translate(96 520)">
    <rect x="0" y="0" width="230" height="46" rx="23" fill="#0EA5E9" fill-opacity="0.14" stroke="#0EA5E9" stroke-opacity="0.4"/>
    <circle cx="26" cy="23" r="5" fill="#22C55E"/>
    <text x="46" y="31" font-family="Inter, sans-serif" font-size="18" fill="#E2E8F0">100% static · MIT</text>
  </g>
</svg>
